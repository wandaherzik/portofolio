<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <rect width="800" height="600" fill="#F8D27C"/>
  <!-- Decorative background circles -->
  <circle cx="200" cy="150" r="120" fill="#F9A88B" fill-opacity="0.4"/>
  <circle cx="650" cy="450" r="150" fill="#3E9C9A" fill-opacity="0.3"/>

  <!-- Phone Mockup 1 (Main) -->
  <g transform="translate(260, 40)">
    <rect x="0" y="0" width="280" height="520" rx="36" fill="#073535"/>
    <rect x="10" y="10" width="260" height="500" rx="28" fill="#FFFFFF"/>
    <!-- Phone Notch -->
    <rect x="90" y="15" width="100" height="18" rx="9" fill="#073535"/>

    <!-- App Header -->
    <rect x="25" y="50" width="120" height="18" rx="6" fill="#3E9C9A"/>
    <circle cx="235" cy="59" r="16" fill="#F9A88B"/>

    <!-- Doctor Banner Card -->
    <rect x="25" y="85" width="230" height="110" rx="16" fill="#0B4A4A"/>
    <circle cx="65" cy="140" r="25" fill="#F8D27C"/>
    <rect x="105" y="115" width="120" height="12" rx="6" fill="#FDF1EA"/>
    <rect x="105" y="135" width="80" height="10" rx="5" fill="#3E9C9A"/>
    <rect x="105" y="155" width="60" height="20" rx="10" fill="#F9A88B"/>

    <!-- Category Pills -->
    <rect x="25" y="210" width="50" height="50" rx="14" fill="#FDF1EA"/>
    <rect x="85" y="210" width="50" height="50" rx="14" fill="#FDF1EA"/>
    <rect x="145" y="210" width="50" height="50" rx="14" fill="#FDF1EA"/>
    <rect x="205" y="210" width="50" height="50" rx="14" fill="#FDF1EA"/>

    <!-- Doctor List -->
    <rect x="25" y="280" width="230" height="70" rx="14" fill="#FDF1EA"/>
    <circle cx="55" cy="315" r="18" fill="#3E9C9A"/>
    <rect x="85" y="305" width="100" height="10" rx="5" fill="#0B4A4A"/>
    <rect x="85" y="322" width="70" height="8" rx="4" fill="#F9A88B"/>

    <rect x="25" y="365" width="230" height="70" rx="14" fill="#FDF1EA"/>
    <circle cx="55" cy="400" r="18" fill="#F9A88B"/>
    <rect x="85" y="390" width="100" height="10" rx="5" fill="#0B4A4A"/>
    <rect x="85" y="407" width="70" height="8" rx="4" fill="#3E9C9A"/>

    <!-- Bottom Navigation -->
    <rect x="20" y="455" width="240" height="45" rx="20" fill="#0B4A4A"/>
    <circle cx="55" cy="477" r="8" fill="#F8D27C"/>
    <circle cx="115" cy="477" r="8" fill="#FDF1EA"/>
    <circle cx="175" cy="477" r="8" fill="#FDF1EA"/>
    <circle cx="225" cy="477" r="8" fill="#FDF1EA"/>
  </g>
</svg>
